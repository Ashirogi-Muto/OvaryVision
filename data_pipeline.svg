<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" width="100%" height="100%">
  <defs>
    <style>
      .main-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 20px; fill: #0f172a; }
      .sub-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 10px; fill: #ffffff; text-transform: uppercase; }
      .stage-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13.5px; fill: #0f172a; }
      .heading-item { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11.5px; fill: #0f172a; }
      .sub-item { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1120" height="480" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(40, 42)">
    <text x="520" y="0" text-anchor="middle" class="main-title">OvaryVision: Overview Data Pipeline</text>
    <text x="520" y="22" text-anchor="middle" class="sub-title">High-level workflow from annotated ultrasound scans to calibrated clinical risk stratification</text>
  </g>

  <!-- STAGE 1: INGESTION -->
  <g transform="translate(35, 95)">
    <rect width="230" height="345" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
    <rect x="14" y="14" width="68" height="24" rx="4" fill="#2563eb" />
    <text x="48" y="30" text-anchor="middle" class="badge-text">Stage 1</text>
    <text x="92" y="31" class="stage-name">Data Ingestion</text>
    <line x1="14" y1="48" x2="216" y2="48" stroke="#bfdbfe" stroke-width="1" />

    <g transform="translate(16, 68)">
      <text x="0" y="0" class="heading-item">MMOTU Dataset</text>
      <text x="0" y="20" class="sub-item">• 1,469 2D B-mode scans</text>
      <text x="0" y="38" class="sub-item">• Contaminated with clinician</text>
      <text x="10" y="54" class="sub-item">calipers, lines &amp; text</text>

      <text x="0" y="90" class="heading-item">Artifact Localization</text>
      <text x="0" y="110" class="sub-item">• Thresholding &amp; OCR filter</text>
      <text x="0" y="128" class="sub-item">• Binary mask M(x, y)</text>
      <text x="0" y="146" class="sub-item">• Precise symbol coordinates</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="272" y1="267" x2="303" y2="267" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)" />

  <!-- STAGE 2: 3 PREPROCESSING ARMS -->
  <g transform="translate(310, 95)">
    <rect width="240" height="345" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8" />
    <rect x="14" y="14" width="68" height="24" rx="4" fill="#7c3aed" />
    <text x="48" y="30" text-anchor="middle" class="badge-text">Stage 2</text>
    <text x="92" y="31" class="stage-name">3 Preprocessing Arms</text>
    <line x1="14" y1="48" x2="226" y2="48" stroke="#e9d5ff" stroke-width="1" />

    <g transform="translate(16, 68)">
      <text x="0" y="0" class="heading-item">Arm A: Raw Baseline</text>
      <text x="0" y="20" class="sub-item">• Annotations left intact</text>
      <text x="0" y="38" class="sub-item">• Control benchmark</text>

      <text x="0" y="74" class="heading-item">Arm B: Generative Inpainting</text>
      <text x="0" y="94" class="sub-item">• MGGAN with FFC</text>
      <text x="0" y="112" class="sub-item">• Synthesizes tissue pixels</text>
      <text x="0" y="130" class="sub-item">• Risk: Hallucinates pathology</text>

      <text x="0" y="166" class="heading-item" fill="#059669">Arm C: Zero-Masking (Proposed)</text>
      <text x="0" y="186" class="sub-item">• Neutral pixel blanking</text>
      <text x="0" y="204" class="sub-item">• Zero synthetic hallucination</text>
      <text x="0" y="222" class="sub-item">• Computationally trivial O(1)</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="557" y1="267" x2="588" y2="267" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)" />

  <!-- STAGE 3: MODEL TRAINING -->
  <g transform="translate(595, 95)">
    <rect width="230" height="345" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8" />
    <rect x="14" y="14" width="68" height="24" rx="4" fill="#0d9488" />
    <text x="48" y="30" text-anchor="middle" class="badge-text">Stage 3</text>
    <text x="92" y="31" class="stage-name">Model Training</text>
    <line x1="14" y1="48" x2="216" y2="48" stroke="#99f6e4" stroke-width="1" />

    <g transform="translate(16, 68)">
      <text x="0" y="0" class="heading-item">Standardized Backbones</text>
      <text x="0" y="20" class="sub-item">• Representative deep CNNs</text>
      <text x="0" y="38" class="sub-item">• Multi-scale receptive fields</text>

      <text x="0" y="74" class="heading-item">Equalized Training</text>
      <text x="0" y="94" class="sub-item">• Class-weighted focal loss</text>
      <text x="0" y="112" class="sub-item">• Identical hyper-parameters</text>

      <text x="0" y="148" class="heading-item">Probability Calibration</text>
      <text x="0" y="168" class="sub-item">• Temperature scaling</text>
      <text x="0" y="186" class="sub-item">• Honest clinical confidence</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="832" y1="267" x2="863" y2="267" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)" />

  <!-- STAGE 4: DUAL EVALUATION -->
  <g transform="translate(870, 95)">
    <rect width="215" height="345" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" />
    <rect x="14" y="14" width="68" height="24" rx="4" fill="#d97706" />
    <text x="48" y="30" text-anchor="middle" class="badge-text">Stage 4</text>
    <text x="92" y="31" class="stage-name">Dual Evaluation</text>
    <line x1="14" y1="48" x2="201" y2="48" stroke="#fde68a" stroke-width="1" />

    <g transform="translate(16, 68)">
      <text x="0" y="0" class="heading-item">1. External Validation</text>
      <text x="0" y="20" class="sub-item">• Clean OvaTUS-V1 scans</text>
      <text x="0" y="38" class="sub-item">• Accuracy, AUC, ECE</text>

      <text x="0" y="74" class="heading-item">2. Pixel-Fidelity Audit</text>
      <text x="0" y="94" class="sub-item">• SSIM, LPIPS &amp; texture</text>
      <text x="0" y="112" class="sub-item">• Checks for hallucinations</text>

      <text x="0" y="148" class="heading-item" fill="#b45309">Clinical Outcome</text>
      <text x="0" y="168" class="sub-item">• Calibrated O-RADS tiers</text>
      <text x="0" y="186" class="sub-item">• Safe AI preprocessing</text>
    </g>
  </g>
</svg>
