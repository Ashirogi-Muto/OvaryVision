project:
  name: "OvaryVision"
  version: "0.1.0"
  description: "Data-Centric Benchmark of Generative Inpainting vs Non-Generative Masking in Ovarian Ultrasound CAD"

paths:
  project_root: "."
  data_dir: "data"
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  manifests_dir: "data/manifests"
  outputs_dir: "outputs"
  logs_dir: "logs"

preprocessing:
  image_size: [256, 256]
  channels: 3
  normalization: "imagenet"
  arms:
    - "arm_a_raw"
    - "arm_b_inpainted"
    - "arm_c_masked"
  neutral_fill_value: 0
  mask_dilation_radius: 2
  inpainting_engine: "mggan"

modeling:
  available_backbones:
    - "convnext_small"
    - "efficientnet_b3"
    - "convnext_tiny"
    - "efficientnet_b0"
  default_backbone: "convnext_small"
  pretrained: true
  num_classes: 2
  positive_class_index: 1

training:
  batch_size: 32
  num_workers: 2
  max_epochs: 50
  early_stopping_patience: 10
  monitor_metric: "val_macro_f1"
  mixed_precision: true
  loss:
    name: "class_weighted_focal_loss"
    gamma: 2.0
    alpha_balanced: true
  optimizer:
    name: "adamw"
    learning_rate: 0.0001
    weight_decay: 0.0001
  scheduler:
    name: "cosine_annealing"
    warmup_epochs: 5
    min_lr: 0.000001

calibration:
  method: "temperature_scaling"
  num_bins: 15
  split_fit: "val"

evaluation:
  seeds:
    - 42
    - 1337
    - 2026
  non_inferiority_margin: -0.02
  bootstrap_iterations: 1000
  confidence_level: 0.95

logging:
  level: "INFO"
  max_bytes: 10485760  # 10 MB
  backup_count: 5

